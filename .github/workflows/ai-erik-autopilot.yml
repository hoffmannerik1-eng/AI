name: AI ERIK Cartoon-Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: ai-erik-cartoon-autopilot
  cancel-in-progress: false

jobs:
  create-cartoon-short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: autopilot/requirements.txt
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install dependencies (uses cache when available)
        run: python -m pip install -r autopilot/requirements.txt
      - name: Check Python syntax
        run: python -m py_compile autopilot/main.py autopilot/video_provider.py
      - name: Create animated cartoon short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MAGIC_HOUR_API_KEY: ${{ secrets.MAGIC_HOUR_API_KEY }}
          MAGIC_HOUR_ENABLE_GENERATION: ${{ github.event_name == 'workflow_dispatch' && vars.MAGIC_HOUR_ENABLE_GENERATION == 'true' && 'true' || 'false' }}
          MAGIC_HOUR_MAX_CREDITS_PER_EPISODE: ${{ vars.MAGIC_HOUR_MAX_CREDITS_PER_EPISODE || '0' }}
          OPENROUTER_MODEL: openrouter/free
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: public
          DRY_RUN: 'false'
        run: python autopilot/main.py
      - name: Save story episode history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add autopilot/story_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Save AI cartoon episode history"
            git push
          fi
      - name: Save uploaded episode artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-erik-cartoon-short-${{ github.run_number }}
          path: autopilot/output/
          if-no-files-found: ignore
          retention-days: 7
