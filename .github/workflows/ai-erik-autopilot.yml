name: AI ERIK Stadt-Autopilot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: ai-erik-stadt-autopilot
  cancel-in-progress: false

jobs:
  create-city-episode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install -r autopilot/requirements.txt
      - name: Create city episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: openrouter/free
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: public
          DRY_RUN: 'false'
        run: python autopilot/main.py
      - name: Save evolving city state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add autopilot/city_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update AI city world state"
            git push
          fi
      - name: Save uploaded episode artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-erik-stadtfolge-${{ github.run_number }}
          path: autopilot/output/
          if-no-files-found: ignore
          retention-days: 7
